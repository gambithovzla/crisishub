name: Backup Supabase

# Backup automático diario de la base de datos.
# Requiere el secreto del repositorio: SUPABASE_DB_URL
#   (Supabase → Project Settings → Database → Connection string → URI,
#    con la contraseña incluida y ?sslmode=require al final)
# El backup queda como "Artifact" descargable en cada ejecución (90 días).

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC todos los días
  workflow_dispatch: {} # permite ejecutarlo a mano

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Volcar y comprimir la base de datos
        run: |
          docker run --rm postgres:17 pg_dump \
            "${{ secrets.SUPABASE_DB_URL }}" \
            --no-owner --no-privileges \
            | gzip > "backup-$(date +%Y%m%d-%H%M).sql.gz"

      - name: Subir backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.sql.gz"
          retention-days: 90
